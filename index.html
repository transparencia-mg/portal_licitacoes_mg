    function gerarURLComFiltros() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams();
        
        const activeTab = document.querySelector('.nav-tabs .nav-link.active');
        if (activeTab) {
            const tabId = activeTab.id.replace('-tab', '');
            params.set('tab', tabId);
        }
        
        if (buscaAtiva.visaoGeral) params.set('buscaVG', buscaAtiva.visaoGeral);
        if (buscaAtiva.licitacoes) params.set('buscaCL', buscaAtiva.licitacoes);
        if (buscaAtiva.itens) params.set('buscaITEM', buscaAtiva.itens);
        
        const filtrosVG = {
            ano: document.getElementById('filtroAnoVG')?.value,
            orgao: document.getElementById('filtroOrgaoVG')?.value,
            modalidade: document.getElementById('filtroModalidadeVG')?.value,
            situacao: document.getElementById('filtroSituacaoVG')?.value,
            emergencial: document.getElementById('filtroEmergencialVG')?.value,
            tipo: document.getElementById('filtroTipoVG')?.value
        };
        
        Object.entries(filtrosVG).forEach(([key, value]) => {
            if (value) params.set(`vg_${key}`, value);
        });
        
        const filtrosCL = {
            ano: document.getElementById('filtroAnoCL')?.value,
            orgao: document.getElementById('filtroOrgaoCL')?.value,
            modalidade: document.getElementById('filtroModalidadeCL')?.value,
            situacao: document.getElementById('filtroSituacaoCL')?.value,
            situacaoItem: document.getElementById('filtroSituacaoItemCL')?.value,
            emergencial: document.getElementById('filtroEmergencialCL')?.value,
            tipo: document.getElementById('filtroTipoCL')?.value,
            processo: document.getElementById('filtroProcessoCL')?.value,
            fornecedor: document.getElementById('filtroFornecedorCL')?.value,
            cnpj: document.getElementById('filtroCnpjCL')?.value,
            objeto: document.getElementById('filtroObjetoCL')?.value
        };
        
        Object.entries(filtrosCL).forEach(([key, value]) => {
            if (value) params.set(`cl_${key}`, value);
        });
        
        const filtrosITEM = {
            ano: document.getElementById('filtroAnoITEM')?.value,
            orgao: document.getElementById('filtroOrgaoITEM')?.value,
            elemento: document.getElementById('filtroElementoITEM')?.value,
            descricaoElemento: document.getElementById('filtroDescricaoElementoITEM')?.value,
            fornecedor: document.getElementById('filtroFornecedorITEM')?.value,
            processo: document.getElementById('filtroProcessoITEM')?.value
        };
        
        Object.entries(filtrosITEM).forEach(([key, value]) => {
            if (value) params.set(`item_${key}`, value);
        });
        
        params.set('sortVG_col', sortConfig.visaoGeral.column);
        params.set('sortVG_dir', sortConfig.visaoGeral.direction);
        params.set('sortCL_col', sortConfig.licitacoes.column);
        params.set('sortCL_dir', sortConfig.licitacoes.direction);
        params.set('sortITEM_col', sortConfig.itens.column);
        params.set('sortITEM_dir', sortConfig.itens.direction);
        
        params.set('pageVG', paginacao.visaoGeral.paginaAtual);
        params.set('pageCL', paginacao.licitacoes.paginaAtual);
        params.set('pageITEM', paginacao.itens.paginaAtual);
        
        params.set('perPageCL', paginacao.licitacoes.itensPorPagina);
        params.set('perPageITEM', paginacao.itens.itensPorPagina);
        
        url.search = params.toString();
        return url.toString();
    }

    function carregarFiltrosDaURL() {
        const params = new URLSearchParams(window.location.search);
        
        const tab = params.get('tab');
        if (tab) {
            const tabElement = document.getElementById(`${tab}-tab`);
            if (tabElement) {
                setTimeout(() => tabElement.click(), 100);
            }
        }
        
        buscaAtiva.visaoGeral = params.get('buscaVG') || '';
        buscaAtiva.licitacoes = params.get('buscaCL') || '';
        buscaAtiva.itens = params.get('buscaITEM') || '';
        
        const filtrosVG = ['ano', 'orgao', 'modalidade', 'situacao', 'emergencial', 'tipo'];
        filtrosVG.forEach(filtro => {
            const valor = params.get(`vg_${filtro}`);
            if (valor) {
                const elemento = document.getElementById(`filtro${filtro.charAt(0).toUpperCase() + filtro.slice(1)}VG`);
                if (elemento) elemento.value = valor;
            }
        });
        
        const filtrosCL = ['ano', 'orgao', 'modalidade', 'situacao', 'situacaoItem', 'emergencial', 'tipo', 'processo', 'fornecedor', 'cnpj', 'objeto'];
        filtrosCL.forEach(filtro => {
            const valor = params.get(`cl_${filtro}`);
            if (valor) {
                const elemento = document.getElementById(`filtro${filtro.charAt(0).toUpperCase() + filtro.slice(1)}CL`);
                if (elemento) elemento.value = valor;
            }
        });
        
        const filtrosITEM = ['ano', 'orgao', 'elemento', 'descricaoElemento', 'fornecedor', 'processo'];
        filtrosITEM.forEach(filtro => {
            const valor = params.get(`item_${filtro}`);
            if (valor) {
                const elemento = document.getElementById(`filtro${filtro.charAt(0).toUpperCase() + filtro.slice(1)}ITEM`);
                if (elemento) elemento.value = valor;
            }
        });
        
        const sortVGCol = params.get('sortVG_col');
        const sortVGDir = params.get('sortVG_dir');
        if (sortVGCol && sortVGDir) {
            sortConfig.visaoGeral.column = sortVGCol;
            sortConfig.visaoGeral.direction = sortVGDir;
        }
        
        const sortCLCol = params.get('sortCL_col');
        const sortCLDir = params.get('sortCL_dir');
        if (sortCLCol && sortCLDir) {
            sortConfig.licitacoes.column = sortCLCol;
            sortConfig.licitacoes.direction = sortCLDir;
        }
        
        const sortITEMCol = params.get('sortITEM_col');
        const sortITEMDir = params.get('sortITEM_dir');
        if (sortITEMCol && sortITEMDir) {
            sortConfig.itens.column = sortITEMCol;
            sortConfig.itens.direction = sortITEMDir;
        }
        
        const pageVG = params.get('pageVG');
        if (pageVG) paginacao.visaoGeral.paginaAtual = parseInt(pageVG);
        
        const pageCL = params.get('pageCL');
        if (pageCL) paginacao.licitacoes.paginaAtual = parseInt(pageCL);
        
        const pageITEM = params.get('pageITEM');
        if (pageITEM) paginacao.itens.paginaAtual = parseInt(pageITEM);
        
        const perPageCL = params.get('perPageCL');
        if (perPageCL) {
            paginacao.licitacoes.itensPorPagina = parseInt(perPageCL);
            const selectCL = document.getElementById('itensPorPaginaCL');
            if (selectCL) selectCL.value = perPageCL;
        }
        
        const perPageITEM = params.get('perPageITEM');
        if (perPageITEM) {
            paginacao.itens.itensPorPagina = parseInt(perPageITEM);
            const selectITEM = document.getElementById('itensPorPaginaITEM');
            if (selectITEM) selectITEM.value = perPageITEM;
        }
    }

    function getCabecalhoPDF(titulo) {

        return {
            titulo,

    window.exportarTabelaVisaoGeral = function() {
        const csvContent = gerarCSVVisaoGeral();
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'visao_geral_licitacoes.csv';
        link.click();
    };

    function gerarCSVVisaoGeral() {
        const dados = window.visaoGeralAgrupados.map(item => [
            item.codigo,
            item.orgao,
            item.modalidade,
            item.tipo,
            item.total_processos,
            item.valor_total
        ]);
        
        const cabecalhos = ['Código', 'Órgão', 'Modalidade', 'Tipo', 'Processos', 'Valor Total'];
        const linhas = dados.map(linha => linha.map(celula => `"${celula}"`).join(';'));
        return [cabecalhos.join(';'), ...linhas].join('\n');
    }

    window.exportarTabelaVisaoGeralPDF = function() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape' });
        const cabecalho = getCabecalhoPDF('Visão Geral de Licitações');
        
        const dados = window.visaoGeralAgrupados.slice(0, 100).map(item => [
            item.codigo || '-',
            item.orgao || '-',
            item.modalidade || '-',
            item.tipo || '-',
            item.total_processos || 0,
            formatarMoeda(item.valor_total)
        ]);
        
        doc.autoTable({
            head: [['Código', 'Órgão', 'Modalidade', 'Tipo', 'Processos', 'Valor Total']],
            body: dados,
            didDrawPage: (data) => {
                doc.setFontSize(10);
                doc.text(cabecalho.titulo, 14, 10);
                doc.text(`Emitido em: ${cabecalho.dataHora}`, 14, doc.internal.pageSize.height - 10);
                doc.text(`Fonte: ${cabecalho.url}`, 14, doc.internal.pageSize.height - 5);
            }
        });
        doc.save('visao_geral_licitacoes.pdf');
    };

    window.exportarTabelaLicitacao = function() {
        const csvContent = gerarCSVLicitacoes();

                    linha.push(dataSessao.replace(/<[^>]*>/g, ''));
                } else if (coluna === 'objeto_processo' && colunasVisiveis.objeto_processo) {
                    linha.push(item['objeto_processo']);
                } else if (coluna === 'nome_empresarial_nome_fornecedor' && colunasVisiveis.nome_empresarial_nome_fornecedor) {
                    linha.push(item['nome_empresarial_nome_fornecedor']);
                } else if (coluna === 'situacao_processo') {

                    linha.push(item['situacao_compra_item_processo']);
                } else if (coluna === 'valor_total_homologado') {

                } else if (coluna === 'edital' && colunasVisiveis.edital) {
                    linha.push(getLinkEdital(item).texto);
                }
            }
            
            return linha;
        });
        
        const cabecalhos = [];
        
        for (const coluna of ordemColunas) {
            if (coluna === 'numero_processo_formatado') {
                cabecalhos.push('Processo');
            } else if (coluna === 'numero_contrato' && colunasVisiveis.numero_contrato) {
                cabecalhos.push('Contrato');
            } else if (coluna === 'nome_orgao_entidade_compra' && colunasVisiveis.nome_orgao_entidade_compra) {
                cabecalhos.push('Órgão');
            } else if (coluna === 'procedimento_contratacao_detalhamento_1' && colunasVisiveis.procedimento_contratacao_detalhamento_1) {
                cabecalhos.push('Modalidade');
            } else if (coluna === 'data_licitacao' && colunasVisiveis.data_licitacao) {
                cabecalhos.push('Data Sessão');
            } else if (coluna === 'objeto_processo' && colunasVisiveis.objeto_processo) {
                cabecalhos.push('Objeto');
            } else if (coluna === 'nome_empresarial_nome_fornecedor' && colunasVisiveis.nome_empresarial_nome_fornecedor) {
                cabecalhos.push('Fornecedor');

    window.baixarCSV = function(tipo, anoFiltro = null) {
        let dados, cabecalhos, nomeArquivo;

        if (tipo === 'licitacoes') {
            dados = anoFiltro 
                ? dadosConsolidados.licitacoes.filter(l => l && (l['ano_criacao_pedido'] == anoFiltro || l.ano_referencia == anoFiltro))
                : dadosConsolidados.licitacoes;
            cabecalhos = [
                'ano_criacao_pedido', 'procedimento_contratacao_grupo', 'procedimento_contratacao_detalhamento_1',
                'procedimento_contratacao_especializacao', 'codigo_orgao_entidade_compra', 'nome_orgao_entidade_compra',
                'numero_processo_formatado', 'data_criacao_pedido', 'data_licitacao', 'numero_contrato',
                'indicador_termo_de_contrato', 'situacao_processo', 'situacao_compra_item_processo', 'criterio_julgamento', 'objeto_processo',
                'nome_empresarial_nome_fornecedor', 'cnpj_cpf_fornecedor_formatado', 'numero_parecer_juridico',
                'data_parecer_juridico', 'edital_retificacao_arquivos', 'contrato_termoaditivo_arquivos',
                'valor_total_homologado', 'valor_total_atualizado'
            ];
            nomeArquivo = anoFiltro ? `licitacoes_${anoFiltro}.csv` : 'licitacoes_completas.csv';
        } else if (tipo === 'itens') {
            dados = anoFiltro 
                ? dadosConsolidados.itens.filter(i => i && (i['ano_criacao_processo'] == anoFiltro || i.ano_referencia == anoFiltro))
                : dadosConsolidados.itens;
            cabecalhos = [
                'ano_criacao_processo', 'numero_processo_formatado', 'situacao_item_processo', 'numero_item_processo',
                'codigo_elemento_item_despesa', 'nome_elemento_item_despesa', 'codigo_item_material_servico_numerico',
                'item_material_servico', 'quantidade_item_pedido', 'valor_unitario_referencia_item_pedido',
                'valor_total_referencia_item_pedido'
            ];
            nomeArquivo = anoFiltro ? `itens_${anoFiltro}.csv` : 'itens_completos.csv';
        } else {
            return;
        }

        if (!dados || dados.length === 0) {
            alert('Nenhum dado encontrado para o período selecionado.');
            return;
        }

        const linhas = dados.map(item => 
            cabecalhos.map(cab => {
                let valor = item && item[cab] !== undefined && item[cab] !== null ? item[cab] : '';
                return `"${valor.toString().replace(/"/g, '""')}"`;
            }).join(';')
        );
        
        const csv = [cabecalhos.join(';'), ...linhas].join('\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = nomeArquivo;
        link.click();
    };
