<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Licitações - Portal da Transparência MG</title>

    <!-- ============================================================
         BIBLIOTECAS EXTERNAS
    ============================================================ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <!-- Chart.js | PapaParse | jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>

        /* ============================================================
           1. VARIÁVEIS DE CORES
        ============================================================ */
        :root {
            --primary-dark:      #1a3a5c;
            --primary-darker:    #0f2a44;
            --accent-red:        #b93c42;
            --accent-bright:     #db233f;
            --background-light:  #f5f7fa;
            --success-green:     #28a745;
            --warning-yellow:    #ffc107;
            --info-blue:         #17a2b8;
            --border-color:      #dee2e6;
            --facebook:          #1877f2;
            --twitter:           #1da1f2;
            --linkedin:          #0a66c2;
            --whatsapp:          #25d366;
        }

        /* ============================================================
           2. RESET E CONFIGURAÇÕES GLOBAIS
        ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; margin: 0; padding: 0; height: auto; min-height: auto; }
        body {
            font-family: 'Montserrat', Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-light);
            padding-bottom: 15px;
            overflow-x: hidden;
            min-height: auto;
            height: auto;
            position: relative;
        }
        body, button, input, select, textarea, span, div { font-family: 'Montserrat', sans-serif !important; }
        .material-icons { font-family: 'Material Icons' !important; font-size: 14px; vertical-align: middle; }

        /* ============================================================
           3. LAYOUT PRINCIPAL
        ============================================================ */
        .main-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .container-fluid { width: 100%; max-width: 88% !important; padding: 0 40px; margin: 0; height: auto; min-height: auto; }
        .dashboard-container { width: 100%; max-width: 100%; padding: 0 40px; margin: 0 auto; height: auto; min-height: auto; }
        .tab-content, .tab-pane { width: 100%; height: auto; min-height: auto; overflow: visible; }
        .table-container { height: auto; min-height: auto; overflow: visible; position: relative; }
        .iframe-mode { overflow: visible !important; }

        /* ============================================================
           4. DATA DE ATUALIZAÇÃO
        ============================================================ */
        .data-atualizacao-container { display: flex; justify-content: left; align-items: center; margin: 15px 0; }
        .data-atualizacao-box {
            background: transparent !important;
            border-radius: 8px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--primary-dark);
            font-weight: 600;
            box-shadow: none;
        }
        .data-atualizacao-box i { font-size: 14px; color: var(--accent-red); }

        /* ============================================================
           5. FILTROS
        ============================================================ */
        .filter-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
            border-left: none;
            width: 100%;
        }
        .filter-label { font-size: 13px; font-weight: 600; color: #1a3a5c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-label i { font-size: 14px; color: var(--accent-red); }
        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            transition: all 0.3s ease;
            height: auto;
            width: 100%;
        }
        .form-control:focus, .form-select:focus { border-color: var(--accent-red); box-shadow: 0 0 0 2px rgba(185,60,66,0.15); }
        .modern-select {
            border: 1.5px solid #dfe5ec !important;
            border-radius: 8px !important;
            padding: 10px 12px !important;
            font-size: 13px !important;
            height: 42px !important;
            line-height: 1.5 !important;
            background-color: #fff;
            transition: all 0.2s ease;
            width: 100%;
        }
        .modern-select:focus { border-color: #1a3a5c !important; box-shadow: 0 0 0 2px rgba(26,58,92,0.1); }
        .filters-row { display: flex; gap: 15px; width: 100%; flex-wrap: wrap; margin-bottom: 12px; }
        .filter-group { flex: 1; min-width: 140px; }
        .filter-buttons-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .botoes-abaixo { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }

        /* ============================================================
           6. CARDS DE MÉTRICAS
        ============================================================ */
        .metric-card {
            background: white;
            border-radius: 8px;
            border: 1px solid #e5e9ef;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            height: 100%;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .metric-card:hover { box-shadow: 0 8px 24px rgba(26,58,92,0.13); transform: translateY(-2px); }
        .metric-header {
            background: #20445d;
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .metric-body { padding: 12px 15px; }
        .metric-value { font-size: 20px; font-weight: 700; color: #171c21; }
        .metric-sublabel { font-size: 10px; color: #94a3b8; font-weight: 500; margin-top: 2px; }

        /* ============================================================
           7. GRÁFICOS
        ============================================================ */
        .chart-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .chart-container canvas { max-width: 100%; }
        .chart-header {
            background: #20445d;
            color: white;
            padding: 12px 16px;
            margin: 0;
        }
        .chart-title { font-size: 14px; font-weight: 600; color: white; margin: 0; }
        .chart-wrapper { height: 260px; padding: 10px 15px; width: 100%; }

        /* ============================================================
           8. TABELAS
        ============================================================ */
        .table-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .table-title { font-size: 13px; font-weight: 600; margin: 0; }
        .table-badge { background: #1a3a5c; color: white; padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
        .table-fixed-header-container { position: relative; overflow: auto; width: 100%; max-height: 600px; }
        .table-fixed-header-container table thead th {
            background-color: #54697b !important;
            color: white !important;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 600;
            padding: 12px 10px;
            font-size: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .table { width: 100%; font-size: 12px; border-collapse: collapse; table-layout: auto; }
        .table th, .table td { border: 1px solid #d6dee6; }
        .table thead th {
            background-color: #54697b !important;
            color: white !important;
            font-weight: 600;
            font-size: 12px;
            padding: 12px 10px;
            text-transform: uppercase;
            border: 1px solid #d6dee6;
            cursor: pointer;
            user-select: none;
        }
        .table thead th:first-child { border-top-left-radius: 8px; }
        .table thead th:last-child  { border-top-right-radius: 8px; }
        .table thead th:hover { background-color: #3d5566 !important; }
        .table tbody tr { background-color: #ffffff; }
        .table tbody td { padding: 10px 10px; vertical-align: middle; border-bottom: 1px solid #f1f1f1; font-size: 12px; }
        .table tbody tr:hover { background-color: rgba(41,67,90,0.04); }
        .table tfoot { position: sticky; bottom: 0; z-index: 20; }
        .table tfoot tr, .table tfoot td { background-color: #dfe3e8 !important; font-weight: 700; font-size: 12px; }
        .table-bordered { border: 1px solid #dee2e6; width: 100%; }
        .table-bordered th, .table-bordered td { border: 1px solid #dee2e6; padding: 12px; vertical-align: top; }
        .table-responsive { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

        .orgao-link, .processo-link {
            color: #006a82;
            text-decoration: none;
            font-weight: 400;
            cursor: pointer;
        }
        .orgao-link:hover, .processo-link:hover { color: var(--accent-red); text-decoration: underline; }

        .sortable-header { cursor: pointer; position: relative; padding-right: 22px !important; }
        .sortable-header:hover { background-color: #3d5566 !important; }
        .sortable-header i { font-size: 13px; position: absolute; right: 5px; top: 50%; transform: translateY(-50%); opacity: 0.8; }

        /* Badges situação */
        .badge-situacao { padding: 3px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; display: inline-block; letter-spacing: 0.2px; white-space: nowrap; }
        .badge-ativo       { background: #dcf5e7; color: #0f6b3a; border: 1px solid #b2e6c8; }
        .badge-concluido   { background: #cce5ff; color: #004085; border: 1px solid #b8d4f5; }
        .badge-cancelado   { background: #fde8ea; color: #8b1a22; border: 1px solid #f5b8bc; }
        .badge-emergencial { background: #fff3cd; color: #856404; border: 1px solid #ffe082; }
        .badge-fracassado  { background: #fde8ea; color: #8b1a22; border: 1px solid #f5b8bc; }
        .badge-deserto     { background: #fff3cd; color: #856404; border: 1px solid #ffe082; }
        .badge-homologado  { background: #dcf5e7; color: #0f6b3a; border: 1px solid #b2e6c8; }
        .badge-adjudicado  { background: #d1ecf1; color: #0c5460; border: 1px solid #b0dde5; }

        /* Contrato / Edital */
        .contrato-link { color: #006a82; text-decoration: none; font-weight: 500; }
        .contrato-link:hover { color: var(--accent-red); text-decoration: underline; }
        .nao-aplica { color: #adb5bd; font-size: 11px; }
        .aguardando { color: #856404; font-size: 11px; font-style: italic; }
        .fornecedor-inexistente { color: #adb5bd; font-size: 11px; }
        .emergencial-badge { background: #fff3cd; color: #856404; border: 1px solid #ffe082; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 4px; }
        .text-right { text-align: right; }

        /* ============================================================
           9. BOTÕES
        ============================================================ */
        .btn-pesquisa {
            background: linear-gradient(to right, #20445d, #20445d);
            border: none;
            padding: 0 16px;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 13px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
        }
        .btn-pesquisa:hover { background: linear-gradient(to right, var(--accent-red), #a32c32); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(185,60,66,0.2); color: white; }
        .btn-primary-custom { background: linear-gradient(to right, #20445d, #20445d); border: none; padding: 0 16px; font-weight: 600; border-radius: 6px; font-size: 13px; color: white; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; height: 36px; white-space: nowrap; transition: all 0.3s ease; }
        .btn-primary-custom:hover { background: linear-gradient(to right, var(--accent-red), #a32c32); color: white; }
        .btn-secondary-custom {
            background: white;
            border: 2px solid var(--primary-darker);
            color: var(--primary-darker);
            padding: 0 16px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 36px;
            white-space: nowrap;
            text-decoration: none !important;
        }
        .btn-secondary-custom:hover { background-color: #132837 !important; color: white !important; border-color: #132837 !important; }
        .btn-export {
            appearance: none;
            -webkit-appearance: none;
            background: transparent !important;
            border: 1px solid #d6dee6;
            color: #1a3a5c;
            padding: 0 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-export i { font-size: 14px !important; }
        button.btn-export:hover, a.btn-export:hover { background-color: #1a3a5c !important; border-color: #1a3a5c !important; color: #ffffff !important; }
        .btn-action {
            padding: 4px;
            border-radius: 7px;
            border: 1.5px solid #1a3a5c;
            background-color: #ffffff;
            color: #1a3a5c;
            width: 32px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-action:hover { background-color: #1a3a5c; color: #ffffff; }
        .btn-topo {
            background: #eeeff5;
            color: #1a3a5c;
            border: 1px solid #d6dee6;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            height: 32px;
        }
        .btn-topo:hover { background-color: #1a3a5c; color: #ffffff; border-color: #1a3a5c; }

        /* Compartilhar */
        .share-dropdown { position: relative; display: inline-block; }
        .share-options {
            display: none; position: absolute; right: 0; top: 100%; background-color: white;
            min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 8px;
            padding: 8px; z-index: 2000; border: 1px solid #dee2e6; margin-top: 5px;
        }
        .share-options.show { display: block; }
        .share-options a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; font-size: 13px; color: var(--primary-dark); transition: background 0.2s; cursor: pointer; text-decoration: none; }
        .share-options a:hover { background-color: var(--background-light); color: var(--accent-red); }
        .share-options a i { font-size: 14px; width: 16px; text-align: center; }

        /* Seletor de colunas */
        .column-selector { position: relative; display: inline-block; }
        .column-selector-dropdown { display: none; position: absolute; right: 0; top: 100%; background: white; min-width: 260px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); border-radius: 8px; z-index: 2000; margin-top: 5px; padding: 15px; border: 1px solid #e9ecef; max-height: 320px; overflow-y: auto; }
        .column-selector-dropdown.show { display: block; }
        .column-selector-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #e9ecef; }
        .column-selector-header h6 { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin: 0; }
        .column-selector-close { cursor: pointer; color: #6c757d; font-size: 14px; }
        .column-selector-close:hover { color: var(--accent-red); }
        .column-selector-item { display: flex; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
        .column-selector-item:hover { background-color: #f8f9fa; }
        .column-selector-item input[type="checkbox"] { width: 14px; height: 14px; margin-right: 8px; cursor: pointer; accent-color: var(--primary-dark); }
        .column-selector-item label { font-size: 12px; cursor: pointer; flex: 1; color: var(--primary-dark); }
        .fixed-column-badge { font-size: 10px; background-color: #e9ecef; color: #6c757d; padding: 2px 6px; border-radius: 12px; font-weight: 600; margin-right: 8px; }

        /* ============================================================
           10. NAVEGAÇÃO (abas)
        ============================================================ */
        .nav-tabs-container { background: transparent; padding: 10px 0; margin-top: 15px; margin-bottom: 15px; width: 100%; }
        .nav-tabs { border: none !important; gap: 10px; width: 100%; flex-wrap: wrap; }
        .nav-tabs .nav-link {
            border: none !important;
            background: #ffffff !important;
            border-radius: 10px !important;
            padding: 8px 18px !important;
            font-weight: 500;
            font-size: 13px;
            color: #1a3a5c !important;
            display: inline-flex !important;
            align-items: center;
            gap: 6px;
            transition: all .25s ease;
            white-space: nowrap;
        }
        .nav-tabs .nav-link:hover { background: #e6e9ed !important; }
        .nav-tabs .nav-link.active { background: #234c63 !important; color: #fff !important; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .nav-tabs .material-icons { font-size: 14px !important; }

        /* ============================================================
           11. MODAL
        ============================================================ */
        .modal-creative .modal-header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-darker) 100%);
            color: white !important;
            padding: 15px 20px;
            border-bottom: none;
        }
        .modal-creative .modal-header .modal-title { color: white !important; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .modal-creative .modal-header .btn-close { filter: brightness(0) invert(1); opacity: 1; }
        .modal-creative .modal-header .btn-close:hover { opacity: 0.8; }
        .info-card { background: #f8fafd; border-radius: 10px; padding: 13px 16px; margin-bottom: 13px; border: 1px solid #e2e8f0; border-left: 4px solid var(--accent-red); }
        .info-card.primary { border-left-color: var(--primary-dark); }
        .info-label { font-size: 10px; text-transform: uppercase; color: #64748b; font-weight: 600; margin-bottom: 4px; }
        .info-value { font-size: 13px; font-weight: 500; color: #1e293b; word-break: break-word; }
        .info-value.highlight { font-size: 16px; color: var(--accent-red); font-weight: 700; }

        /* ============================================================
           12. PAGINAÇÃO
        ============================================================ */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            width: 100%;
            flex-wrap: wrap;
            gap: 10px;
            border-radius: 0 0 8px 8px;
        }
        .pagination-info { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #6c757d; flex-wrap: wrap; }
        .pagination-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .pagination-controls button {
            min-width: 34px; height: 34px; border: 1px solid #dee2e6; background: white; color: var(--primary-dark);
            border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; font-size: 13px; padding: 0 6px;
        }
        .pagination-controls button:hover:not(:disabled) { background-color: var(--primary-dark); color: white; border-color: var(--primary-dark); }
        .pagination-controls button.active { background-color: var(--primary-dark); color: white; border-color: var(--primary-dark); }
        .pagination-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-size-selector { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6c757d; }
        .page-size-selector select { width: 70px; border: 1px solid #d6dee6; border-radius: 6px; padding: 4px 6px; font-size: 12px; background-color: white; color: var(--primary-dark); font-weight: 600; cursor: pointer; outline: none; }
        .page-input { display: flex; align-items: center; gap: 6px; }
        .page-input input { width: 56px; height: 32px; border: 1px solid #dee2e6; border-radius: 6px; text-align: center; font-size: 13px; padding: 0 4px; }
        .page-input input:focus { outline: none; border-color: var(--primary-dark); }
        .page-input button { height: 32px; background: var(--primary-dark); color: white; border: none; border-radius: 6px; padding: 0 10px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .page-input button:hover { background: var(--accent-red); }

        /* ============================================================
           13. TOOLBAR
        ============================================================ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .toolbar-left  { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .action-buttons-container { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        /* ============================================================
           14. LOADING
        ============================================================ */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(238,241,246,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 14px;
        }
        .loading-overlay.show { display: flex; }
        .loading-progress { font-size: 13px; color: #20445d; font-weight: 700; }
        .loading-indicator {
            position: fixed; bottom: 20px; right: 20px;
            background: var(--primary-dark); color: white;
            padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600;

<script>
// ============================================================

const PORTAL_DADOS_ABERTOS_URL = 'https://dados.mg.gov.br/dataset/portal_licitacoes_mg';

const ARQUIVOS_POR_ANO = {

    2023: { licitacoes: 'licitacoes2023.csv', itens: 'item2023.csv' },

let dadosConsolidados = { licitacoes: [], itens: [] };
let anosDisponiveis = [2026, 2025, 2024, 2023, 2022];
let dadosFiltrados  = { visaoGeral: [], licitacoes: [], itens: [] };
let metricaGeral    = {};

let sortConfig = {

let paginacao = {

    licitacoes: { paginaAtual: 1, itensPorPagina: 50, totalPaginas: 1 },
    itens:      { paginaAtual: 1, itensPorPagina: 50, totalPaginas: 1 }
};

let chartModalidades = null;
let chartSituacao    = null;

let buscaAtiva = { visaoGeral: '', licitacoes: '', itens: '' };

let colunasVisiveis = {
    numero_contrato: true,
    nome_orgao_entidade_compra: true,
    procedimento_contratacao_detalhamento_1: true,
    data_licitacao: true,

};

const ordemColunas = [
    'numero_processo_formatado','numero_contrato','nome_orgao_entidade_compra',
    'procedimento_contratacao_detalhamento_1','data_licitacao','objeto_processo',

    'valor_estimado','valor_total_homologado','edital','acoes'
];
const colunasFixas = ['numero_processo_formatado','situacao_processo','valor_total_homologado','acoes'];

const modalidadesComSessao = ['Pregão','Carta Convite','Concorrência','Leilão','Tomada de Preços'];
const chartPalette = ['#1a3a5c','#2c5f8a','#3a7cb8','#5a9fd4','#7ab8e0','#9dd1ec','#bde4f5','#d4a017','#c0392b','#27ae10'];

// ============================================================
// 2. AUXILIARES
// ============================================================
function mostrarLoading(show, msg) {
    const overlay = document.getElementById('loadingOverlay');
    if (show) { overlay.classList.add('show'); }
    else { overlay.classList.remove('show'); overlay.style.display = 'none'; }
    if (msg) document.getElementById('loadingProgress').textContent = msg;
}

function showLoading(show, message) {
    const el = document.getElementById('loadingIndicator');
    if (!el) return;
    if (message) el.querySelector('span').textContent = message;
    show ? el.classList.add('show') : el.classList.remove('show');
}

function mostrarToast(mensagem, tipo) {
    // Remove toasts antigos
    document.querySelectorAll('.toast-notification').forEach(t => t.remove());
    const toast = document.createElement('div');
    toast.className = `toast-notification ${tipo}`;
    toast.innerHTML = `<div class="toast-content"><i class="material-icons me-1">${tipo === 'success' ? 'check_circle' : 'error'}</i><span>${mensagem}</span></div>`;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 100);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function iframeUpdateHeight() {
    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight,
        document.querySelector('.main-container')?.scrollHeight || 0) + 10;
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ iframeHeight: h, height: h, type: 'resize' }, '*'); } catch(e) {}
    return h;
}

function voltarAoTopo() {
    if (window.parent && window.parent !== window) {
        window.parent.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // Tenta também fazer scroll no elemento pai do iframe
    try {
        let el = window.frameElement;
        if (el) {
            let parent = el.closest('.tab-pane, .content-wrapper, body, html');
            if (parent) parent.scrollTop = 0;
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        }
    } catch(e) {}
}

function formatarMoeda(valor) {
    if (valor === undefined || valor === null || valor === '') return 'R$ 0,00';
    let s = valor.toString().replace(',', '.');
    const num = parseFloat(s);
    if (isNaN(num)) return 'R$ 0,00';
    return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2 });
}

function formatarData(dataStr) {
    if (!dataStr || dataStr === '0000-00-00 00:00:00') return '-';
    if (dataStr.includes('/')) return dataStr;
    const partes = dataStr.split(' ')[0].split('-');
    if (partes.length < 3) return dataStr;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function verificarEmergencial(processo) {
    if (!processo) return false;
    return (processo['procedimento_contratacao_especializacao'] || '').includes('Dispensa de Licitação - Casos de emergência ou de calamidade pública');
}

function verificarSemEdital(processo) {
    if (!processo) return false;
    const m = processo['procedimento_contratacao_detalhamento_1'] || '';
    const g = processo['procedimento_contratacao_grupo'] || '';
    return m.includes('Dispensa')||m.includes('Inexigibilidade')||g.includes('Dispensa')||g.includes('Inexigibilidade')||m.includes('Registro de Preços');
}

function getDataSessao(processo) {
    const modalidade = processo['procedimento_contratacao_detalhamento_1'] || '';
    const data = processo['data_licitacao'];
    if (!data || data === '0000-00-00 00:00:00') {
        const temSessao = modalidadesComSessao.some(m => modalidade.includes(m));
        return temSessao ? '<span class="aguardando">Aguardando data</span>' : '<span class="nao-aplica">Não se aplica</span>';
    }
    return formatarData(data);
}

function getInfoContrato(processo) {
    if (!processo) return { texto: 'NÃO SE APLICA', display: '<span class="nao-aplica">NÃO SE APLICA</span>', numero: null };
    const situacaoCompraItem = processo['situacao_compra_item_processo'] || '';
    const indicadorContrato  = processo['indicador_termo_de_contrato'] || '';
    const numeroContrato     = processo['numero_contrato'];
    const fornecedor         = processo['nome_empresarial_nome_fornecedor'] || '';
    const urlContrato        = processo['contrato_termoaditivo_arquivos'];
    if (fornecedor === 'INEXISTENTE' || !fornecedor) return { texto: 'Fornecedor inexistente', display: '<span class="fornecedor-inexistente">Fornecedor inexistente</span>', numero: null };
    const semContrato = ['Fracassado','Deserto','Anulado','Cancelado','Suspenso'];
    if (semContrato.some(s => situacaoCompraItem.includes(s))) return { texto: situacaoCompraItem, display: `<span class="badge-situacao ${getBadgeClassPorSituacao(situacaoCompraItem)}">${situacaoCompraItem}</span>`, numero: null };
    if (indicadorContrato === 'SIM' || indicadorContrato === 'S') {
        if (numeroContrato && numeroContrato !== '0' && numeroContrato !== '') {
            if (urlContrato) return { texto: numeroContrato, display: `<a href="${urlContrato}" target="_blank" class="contrato-link">${numeroContrato}</a>`, numero: numeroContrato };
            return { texto: numeroContrato, display: `<span class="contrato-link" style="cursor:default">${numeroContrato}</span>`, numero: numeroContrato };
        }
        return { texto: 'Aguardando assinatura', display: '<span class="aguardando">Aguardando assinatura</span>', numero: null };
    }
    return { texto: 'NÃO SE APLICA', display: '<span class="nao-aplica">NÃO SE APLICA</span>', numero: null };
}

function getLinkEdital(processo) {
    if (!processo) return { texto: 'NÃO SE APLICA', url: null };
    if (verificarSemEdital(processo)) return { texto: 'NÃO SE APLICA', url: null };
    if (processo['edital_retificacao_arquivos']) return { texto: '📄 Ver Edital', url: processo['edital_retificacao_arquivos'] };
    return { texto: 'NÃO SE APLICA', url: null };
}

function getBadgeClassPorSituacao(situacao) {
    const s = (situacao||'').toLowerCase();
    if (s.includes('homologado')||s.includes('adjudicado')) return 'badge-homologado';
    if (s.includes('fracassado')) return 'badge-fracassado';
    if (s.includes('deserto'))    return 'badge-deserto';
    if (s.includes('cancelado')||s.includes('anulado')) return 'badge-cancelado';
    if (s.includes('concluído')||s.includes('concluido')) return 'badge-concluido';
    return 'badge-concluido';
}

function calcularMetricas(dados) {
    const totalProcessos  = new Set(dados.map(i => i['numero_processo_formatado'])).size;
    const totalOrgaos     = new Set(dados.map(i => i['nome_orgao_entidade_compra'])).size;
    const totalFornecedores = new Set(dados.map(i => i['nome_empresarial_nome_fornecedor'])).size;
    let totalHomologado = 0;
    dados.forEach(i => { const v = i['valor_total_homologado']; if (v) { const n = parseFloat(v.toString().replace(',','.')); if (!isNaN(n)) totalHomologado += n; } });
    return { totalProcessos, totalOrgaos, totalFornecedores, totalHomologado, totalRegistros: dados.length };
}

function obterOpcoesFiltro(dados, tipo) {
    if (!dados || dados.length === 0) return { anos:[], orgaos:[], fornecedores:[], elementos:[], tipos:[], situacoes:[], modalidades:[], criterios:[], grupos:[], processos:[] };
    if (tipo === 'itens') {
        const orgaosSet = new Set(), fornecedoresSet = new Set();
        const licitacoesMap = {};
        if (dadosConsolidados.licitacoes) dadosConsolidados.licitacoes.forEach(l => { if (l['numero_processo_formatado']) licitacoesMap[l['numero_processo_formatado']] = l; });
        dados.forEach(item => { const proc = item['numero_processo_formatado']; if (proc && licitacoesMap[proc]) { const lic = licitacoesMap[proc]; if (lic['nome_orgao_entidade_compra']) orgaosSet.add(lic['nome_orgao_entidade_compra']); if (lic['nome_empresarial_nome_fornecedor']) fornecedoresSet.add(lic['nome_empresarial_nome_fornecedor']); } });
        return { anos:[...new Set(dados.map(i=>i['ano_criacao_processo']))].filter(Boolean).sort((a,b)=>b-a), orgaos:Array.from(orgaosSet).sort(), fornecedores:Array.from(fornecedoresSet).sort(), elementos:[...new Set(dados.map(i=>i['codigo_elemento_item_despesa']))].filter(Boolean).sort(), tipos:['Material','Serviço'], situacoes:[...new Set(dados.map(i=>i['situacao_item_processo']))].filter(Boolean).sort(), modalidades:[], criterios:[], grupos:[], processos:[...new Set(dados.map(i=>i['numero_processo_formatado']))].filter(Boolean).sort() };
    }
    return { anos:[...new Set(dados.map(i=>i['ano_criacao_pedido']))].filter(Boolean).sort((a,b)=>b-a), modalidades:[...new Set(dados.map(i=>i['procedimento_contratacao_detalhamento_1']))].filter(Boolean).sort(), orgaos:[...new Set(dados.map(i=>i['nome_orgao_entidade_compra']))].filter(Boolean).sort(), situacoes:[...new Set(dados.map(i=>i['situacao_processo']))].filter(Boolean).sort(), situacoesItem:[...new Set(dados.map(i=>i['situacao_compra_item_processo']))].filter(Boolean).sort(), criterios:[...new Set(dados.map(i=>i['criterio_julgamento']))].filter(Boolean).sort(), grupos:[...new Set(dados.map(i=>i['procedimento_contratacao_grupo']))].filter(Boolean).sort(), fornecedores:[...new Set(dados.map(i=>i['nome_empresarial_nome_fornecedor']))].filter(Boolean).sort(), processos:[...new Set(dados.map(i=>i['numero_processo_formatado']))].filter(Boolean).sort() };
}

function agruparVisaoGeral(dados) {
    const mapa = new Map();
    dados.forEach(item => {
        const codigo    = item['codigo_orgao_entidade_compra'] || 'N/I';
        const orgao     = item['nome_orgao_entidade_compra'] || 'Não informado';
        const modalidade= item['procedimento_contratacao_detalhamento_1'] || 'Não informado';
        const tipo      = item['procedimento_contratacao_grupo'] || 'Não informado';
        const valorEst  = parseFloat((item['valor_total_referencia_item_processo']||'').toString().replace(',','.')) || 0;
        const valor     = parseFloat((item['valor_total_homologado']||'').toString().replace(',','.')) || 0;
        const chave     = `${codigo}|${modalidade}|${tipo}`;
        if (!mapa.has(chave)) mapa.set(chave, { codigo, orgao, modalidade, tipo, valor_estimado_total:0, valor_total:0, processos:new Set() });
        const reg = mapa.get(chave);
        reg.valor_total += valor; reg.valor_estimado_total += valorEst;
        if (item['numero_processo_formatado']) reg.processos.add(item['numero_processo_formatado']);
    });
    return Array.from(mapa.values()).map(item => ({...item, total_processos: item.processos.size}));
}

function agruparPorModalidade(dados) {
    const mapa = new Map();
    for (const i of dados) { const m = i['procedimento_contratacao_detalhamento_1']||'Não informado'; if (!mapa.has(m)) mapa.set(m,{modalidade:m,total:0,processos:new Set()}); const r=mapa.get(m); if (i['numero_processo_formatado']) r.processos.add(i['numero_processo_formatado']); }
    return Array.from(mapa.values()).map(m=>({modalidade:m.modalidade,processos:m.processos.size})).sort((a,b)=>b.processos-a.processos);
}

function agruparPorSituacao(dados) {
    const mapa = new Map();
    for (const i of dados) { const s = i['situacao_processo']||'Não informado'; if (!mapa.has(s)) mapa.set(s,{situacao:s,total:0,processos:new Set()}); const r=mapa.get(s); if (i['numero_processo_formatado']) r.processos.add(i['numero_processo_formatado']); }
    return Array.from(mapa.values()).map(s=>({situacao:s.situacao,processos:s.processos.size}));
}

function ordenarDados(dados, coluna, direcao) {
    return [...dados].sort((a, b) => {
        let va = a[coluna]!==undefined&&a[coluna]!==null?a[coluna]:'';
        let vb = b[coluna]!==undefined&&b[coluna]!==null?b[coluna]:'';
        if (coluna.includes('valor')||coluna.includes('Valor')||coluna.includes('quantidade')) { va=parseFloat(va.toString().replace(',','.'))||0; vb=parseFloat(vb.toString().replace(',','.'))||0; }
        else { va=va.toString().toLowerCase(); vb=vb.toString().toLowerCase(); }
        return direcao==='asc'?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0);
    });
}

function parseCSV(texto, tipo) {
    try {
        const linhas = texto.trim().split('\n');
        if (linhas.length < 2) return [];
        let cabecalhos = linhas[0].split(';').map(h => h.trim().replace(/^\uFEFF/,'').replace(/"/g,''));
        const dados = [];
        for (let i = 1; i < linhas.length; i++) {
            if (!linhas[i].trim()) continue;
            const linha = linhas[i], valores = [];
            let campoAtual = '', dentroAspas = false;
            for (let j = 0; j < linha.length; j++) {
                const char = linha[j];
                if (char === '"') dentroAspas = !dentroAspas;
                else if (char === ';' && !dentroAspas) { valores.push(campoAtual); campoAtual = ''; }
                else campoAtual += char;
            }
            valores.push(campoAtual);
            const obj = {};
            cabecalhos.forEach((cab, idx) => {
                let valor = valores[idx] !== undefined ? valores[idx] : '';
                if (valor === 'INEXISTENTE' || valor === 'NULL' || valor === '') valor = null;
                if (typeof valor === 'string' && valor.includes(',') && !isNaN(parseFloat(valor.replace(',','.')))) { const n = parseFloat(valor.replace(',','.')); if (!isNaN(n)) valor = n; }
                obj[cab] = valor;
            });
            dados.push(obj);
        }
        return dados;
    } catch(e) { console.error('Erro parseCSV:', e); return []; }
}

async function carregarTodosDados() {
    mostrarLoading(true, 'Carregando dados de licitações...');
    showLoading(true, 'Carregando dados...');
    try {
        dadosConsolidados = { licitacoes: [], itens: [] };
        const promises = [];
        for (const ano of anosDisponiveis) {
            const arquivos = ARQUIVOS_POR_ANO[ano];
            promises.push(fetch(GITHUB_BASE + arquivos.licitacoes).then(async resp => { if (resp.ok) { const texto = await resp.text(); const dados = parseCSV(texto, `licitacoes_${ano}`); dados.forEach(d => { if(d) d.ano_referencia = ano; }); dadosConsolidados.licitacoes = [...dadosConsolidados.licitacoes, ...dados]; } }).catch(err => console.error(`Erro licitações ${ano}:`, err)));
            promises.push(fetch(GITHUB_BASE + arquivos.itens).then(async resp => { if (resp.ok) { const texto = await resp.text(); const dados = parseCSV(texto, `itens_${ano}`); dados.forEach(d => { if(d) d.ano_referencia = ano; }); dadosConsolidados.itens = [...dadosConsolidados.itens, ...dados]; } }).catch(err => console.error(`Erro itens ${ano}:`, err)));
        }
        await Promise.all(promises);
        dadosFiltrados = {
            visaoGeral: dadosConsolidados.licitacoes.filter(l => l && (l['ano_criacao_pedido'] == 2026 || l.ano_referencia == 2026)),
            licitacoes: dadosConsolidados.licitacoes.filter(l => l && (l['ano_criacao_pedido'] == 2026 || l.ano_referencia == 2026)),
            itens: dadosConsolidados.itens.filter(i => i && (i['ano_criacao_processo'] == 2026 || i.ano_referencia == 2026))
        };
        metricaGeral = calcularMetricas(dadosFiltrados.visaoGeral);
        renderizarVisaoGeral();
        renderizarConsultaLicitacao();
        renderizarConsultaItem();
        renderizarDownloads();
        setTimeout(carregarFiltrosDaURL, 500);
        setTimeout(iframeUpdateHeight, 500);
    } catch(erro) {
        console.error('Erro fatal:', erro);
    } finally {
        mostrarLoading(false);
        showLoading(false);
    }
}

function gerarCabecalhosLicitacao() {
    const cabs = [];
    for (const col of ordemColunas) {
        if (col==='numero_processo_formatado') cabs.push(`<th class="sortable-header" onclick="toggleSortCL('numero_processo_formatado')">Processo <i class="material-icons">unfold_more</i></th>`);
        else if (col==='numero_contrato' && colunasVisiveis.numero_contrato) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('numero_contrato')">Contrato <i class="material-icons">unfold_more</i></th>`);
        else if (col==='nome_orgao_entidade_compra' && colunasVisiveis.nome_orgao_entidade_compra) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('nome_orgao_entidade_compra')">Órgão <i class="material-icons">unfold_more</i></th>`);
        else if (col==='procedimento_contratacao_detalhamento_1' && colunasVisiveis.procedimento_contratacao_detalhamento_1) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('procedimento_contratacao_detalhamento_1')">Modalidade <i class="material-icons">unfold_more</i></th>`);
        else if (col==='data_licitacao' && colunasVisiveis.data_licitacao) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('data_licitacao')">Data Sessão <i class="material-icons">unfold_more</i></th>`);
        else if (col==='objeto_processo' && colunasVisiveis.objeto_processo) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('objeto_processo')">Objeto <i class="material-icons">unfold_more</i></th>`);
        else if (col==='nome_empresarial_nome_fornecedor' && colunasVisiveis.nome_empresarial_nome_fornecedor) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('nome_empresarial_nome_fornecedor')">Fornecedor <i class="material-icons">unfold_more</i></th>`);
        else if (col==='situacao_processo') cabs.push(`<th class="sortable-header" onclick="toggleSortCL('situacao_processo')">Sit. Processo <i class="material-icons">unfold_more</i></th>`);
        else if (col==='situacao_compra_item_processo' && colunasVisiveis.situacao_compra_item_processo) cabs.push(`<th class="sortable-header" onclick="toggleSortCL('situacao_compra_item_processo')">Sit. Item <i class="material-icons">unfold_more</i></th>`);
        else if (col==='valor_estimado' && colunasVisiveis.valor_estimado) cabs.push(`<th class="sortable-header text-right" onclick="toggleSortCL('valor_estimado')">Valor Estimado <i class="material-icons">unfold_more</i></th>`);
        else if (col==='valor_total_homologado') cabs.push(`<th class="sortable-header text-right" onclick="toggleSortCL('valor_total_homologado')">Valor Total <i class="material-icons">unfold_more</i></th>`);
        else if (col==='edital' && colunasVisiveis.edital) cabs.push('<th>Edital</th>');
        else if (col==='acoes') cabs.push('<th class="text-center">Ações</th>');
    }
    return cabs.join('');
}

function atualizarTabelaConsultaLicitacao() {
    const inicio = (paginacao.licitacoes.paginaAtual - 1) * paginacao.licitacoes.itensPorPagina;
    const fim = Math.min(inicio + paginacao.licitacoes.itensPorPagina, window.licitacoesFiltradas.length);
    document.getElementById('licitacoesTableBody').innerHTML = gerarLinhasTabelaLicitacoes(window.licitacoesFiltradas.slice(inicio, fim));
    document.getElementById('totalLicitacoesBadge').textContent = `${window.licitacoesFiltradas.length} licitações`;
    renderizarPaginacao('licitacoes');
}

function gerarLinhasTabelaLicitacoes(licitacoes) {
    if (!licitacoes || licitacoes.length === 0) return '<tr><td colspan="15" class="text-center py-4">Nenhum registro encontrado</td></tr>';
    return licitacoes.map(l => {
        const situacao = l['situacao_processo']||'-', situacaoItem = l['situacao_compra_item_processo']||'-';
        const contratoInfo = getInfoContrato(l), dataSessao = getDataSessao(l), editalInfo = getLinkEdital(l);
        const editalDisplay = editalInfo.url?`<a href="${editalInfo.url}" target="_blank" class="contrato-link">${editalInfo.texto}</a>`:`<span class="nao-aplica">${editalInfo.texto}</span>`;
        const fornecedor = l['nome_empresarial_nome_fornecedor']||'-';
        const fornecedorDisplay = fornecedor==='INEXISTENTE'?'<span class="fornecedor-inexistente">INEXISTENTE</span>':fornecedor;
        const isEmergencial = verificarEmergencial(l);
        let linha = '<tr>';
        for (const col of ordemColunas) {
            if (col==='numero_processo_formatado') linha+=`<td><a href="#" class="processo-link" onclick="verDetalhesLicitacao('${(l['numero_processo_formatado']||'').replace(/'/g,"\\'")}');return false;">${l['numero_processo_formatado']||'-'}</a></td>`;
            else if (col==='numero_contrato' && colunasVisiveis.numero_contrato) linha+=`<td>${contratoInfo.display}</td>`;
            else if (col==='nome_orgao_entidade_compra' && colunasVisiveis.nome_orgao_entidade_compra) linha+=`<td>${l['nome_orgao_entidade_compra']||'-'}</td>`;
            else if (col==='procedimento_contratacao_detalhamento_1' && colunasVisiveis.procedimento_contratacao_detalhamento_1) linha+=`<td>${l['procedimento_contratacao_detalhamento_1']||'-'} ${isEmergencial?'<span class="emergencial-badge">Emerg.</span>':''}</td>`;
            else if (col==='data_licitacao' && colunasVisiveis.data_licitacao) linha+=`<td>${dataSessao}</td>`;
            else if (col==='objeto_processo' && colunasVisiveis.objeto_processo) linha+=`<td title="${l['objeto_processo']||''}">${(l['objeto_processo']||'').substring(0,40)}${(l['objeto_processo']||'').length>40?'...':''}</td>`;
            else if (col==='nome_empresarial_nome_fornecedor' && colunasVisiveis.nome_empresarial_nome_fornecedor) linha+=`<td>${fornecedorDisplay}</td>`;
            else if (col==='situacao_processo') linha+=`<td><span class="badge-situacao ${getBadgeClassPorSituacao(situacao)}">${situacao}</span></td>`;
            else if (col==='situacao_compra_item_processo' && colunasVisiveis.situacao_compra_item_processo) linha+=`<td><span class="badge-situacao ${getBadgeClassPorSituacao(situacaoItem)}">${situacaoItem}</span></td>`;
            else if (col==='valor_estimado' && colunasVisiveis.valor_estimado) linha+=`<td class="text-right">${formatarMoeda(l['valor_total_referencia_item_processo'])}</td>`;
            else if (col==='valor_total_homologado') linha+=`<td class="text-right">${formatarMoeda(l['valor_total_homologado'])}</td>`;
            else if (col==='edital' && colunasVisiveis.edital) linha+=`<td>${editalDisplay}</td>`;
            else if (col==='acoes') linha+=`<td class="text-center"><button class="btn-action" onclick="verDetalhesLicitacao('${(l['numero_processo_formatado']||'').replace(/'/g,"\\'")}')"><i class="material-icons" style="font-size:15px">visibility</i></button></td>`;
        }
        return linha + '</tr>';
    }).join('');
}

function toggleSortCL(coluna) {
    if (sortConfig.licitacoes.column===coluna) sortConfig.licitacoes.direction=sortConfig.licitacoes.direction==='asc'?'desc':'asc';
    else { sortConfig.licitacoes.column=coluna; sortConfig.licitacoes.direction='asc'; }
    window.licitacoesFiltradas = ordenarDados(window.licitacoesFiltradas, sortConfig.licitacoes.column, sortConfig.licitacoes.direction);
    paginacao.licitacoes.paginaAtual = 1;
    atualizarTabelaConsultaLicitacao();
}

window.aplicarFiltrosCL = function() {
    const ano = document.getElementById('filtroAnoCL')?.value;
    const orgao = document.getElementById('filtroOrgaoCL')?.value;
    const modalidade = document.getElementById('filtroModalidadeCL')?.value;
    const situacao = document.getElementById('filtroSituacaoCL')?.value;
    const situacaoItem = document.getElementById('filtroSituacaoItemCL')?.value;
    const emergencial = document.getElementById('filtroEmergencialCL')?.value;
    const tipo = document.getElementById('filtroTipoCL')?.value;
    const processo = (document.getElementById('filtroProcessoCL')?.value||'').toLowerCase();
    const fornecedor = (document.getElementById('filtroFornecedorCL')?.value||'').toLowerCase();
    const cnpj = (document.getElementById('filtroCnpjCL')?.value||'').toLowerCase();
    const objeto = (document.getElementById('filtroObjetoCL')?.value||'').toLowerCase();
    window.licitacoesFiltradas = dadosConsolidados.licitacoes.filter(l => {
        if (ano && l['ano_criacao_pedido']!=ano && l.ano_referencia!=ano) return false;
        if (orgao && l['nome_orgao_entidade_compra']!==orgao) return false;
        if (modalidade && l['procedimento_contratacao_detalhamento_1']!==modalidade) return false;
        if (situacao && l['situacao_processo']!==situacao) return false;
        if (situacaoItem && l['situacao_compra_item_processo']!==situacaoItem) return false;
        if (tipo && l['procedimento_contratacao_grupo']!==tipo) return false;
        if (processo && !l['numero_processo_formatado']?.toLowerCase().includes(processo)) return false;
        if (fornecedor && !l['nome_empresarial_nome_fornecedor']?.toLowerCase().includes(fornecedor)) return false;
        if (cnpj && !l['cnpj_cpf_fornecedor_formatado']?.toLowerCase().includes(cnpj)) return false;
        if (objeto && !l['objeto_processo']?.toLowerCase().includes(objeto)) return false;
        if (emergencial) { const e=verificarEmergencial(l); if (emergencial==='sim'&&!e) return false; if (emergencial==='nao'&&e) return false; }
        return true;
    });
    window.licitacoesFiltradas = ordenarDados(window.licitacoesFiltradas, sortConfig.licitacoes.column, sortConfig.licitacoes.direction);
    paginacao.licitacoes.paginaAtual = 1;
    paginacao.licitacoes.totalPaginas = Math.ceil(window.licitacoesFiltradas.length / paginacao.licitacoes.itensPorPagina);
    atualizarTabelaConsultaLicitacao();
};

window.limparFiltrosCL = function() {
    ['filtroAnoCL','filtroOrgaoCL','filtroModalidadeCL','filtroSituacaoCL','filtroSituacaoItemCL','filtroEmergencialCL','filtroTipoCL','filtroProcessoCL','filtroFornecedorCL','filtroCnpjCL','filtroObjetoCL'].forEach(id => { const el=document.getElementById(id); if(el) el.value=id==='filtroAnoCL'?'2026':''; });
    window.licitacoesFiltradas = dadosConsolidados.licitacoes.filter(l => l['ano_criacao_pedido']==2026 || l.ano_referencia==2026);
    window.licitacoesFiltradas = ordenarDados(window.licitacoesFiltradas, sortConfig.licitacoes.column, sortConfig.licitacoes.direction);
    paginacao.licitacoes.paginaAtual = 1;
    paginacao.licitacoes.totalPaginas = Math.ceil(window.licitacoesFiltradas.length / paginacao.licitacoes.itensPorPagina);
    atualizarTabelaConsultaLicitacao();
};

function atualizarTabelaItens() {
    if (!window.itensFiltrados) window.itensFiltrados = [];
    const inicio = (paginacao.itens.paginaAtual - 1) * paginacao.itens.itensPorPagina;
    const fim = Math.min(inicio + paginacao.itens.itensPorPagina, window.itensFiltrados.length);
    document.getElementById('itensTableBody').innerHTML = gerarLinhasTabelaItens(window.itensFiltrados.slice(inicio, fim));
    document.getElementById('totalItensBadge').textContent = `${window.itensFiltrados.length} itens`;
    renderizarPaginacao('itens');
}

function gerarLinhasTabelaItens(itens) {
    if (!itens || itens.length === 0) return '<tr><td colspan="12" class="text-center py-4">Nenhum registro encontrado</td></tr>';
    return itens.map(item => {
        const descricao = item['item_material_servico']||'-';
        const proc = (item['numero_processo_formatado']||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');
        const sit = item['situacao_item_processo']||'-';
        return `<tr>
            <td>${item['ano_criacao_processo']||'-'}</td>
            <td><a href="#" class="processo-link" onclick="verDetalhesLicitacao('${proc}');return false;">${item['numero_processo_formatado']||'-'}</a></td>
            <td>${item['numero_item_processo']||'-'}</td>
            <td><span class="badge-situacao ${getBadgeClassPorSituacao(sit)}">${sit}</span></td>
            <td>${item['codigo_elemento_item_despesa']||'-'}</td>
            <td>${item['nome_elemento_item_despesa']||'-'}</td>
            <td>${item['codigo_item_material_servico_numerico']||'-'}</td>
            <td title="${descricao}">${descricao.substring(0,45)}${descricao.length>45?'...':''}</td>
            <td class="text-right">${item['quantidade_item_pedido']||'-'}</td>
            <td class="text-right">${formatarMoeda(item['valor_unitario_referencia_item_pedido'])}</td>
            <td class="text-right">${formatarMoeda(item['valor_total_referencia_item_pedido'])}</td>
            <td class="text-center"><button class="btn-action" onclick="verDetalhesLicitacao('${proc}')" title="Detalhes"><i class="material-icons" style="font-size:15px">visibility</i></button></td>
        </tr>`;
    }).join('');
}

function toggleSortITEM(coluna) {
    if (sortConfig.itens.column===coluna) sortConfig.itens.direction=sortConfig.itens.direction==='asc'?'desc':'asc';
    else { sortConfig.itens.column=coluna; sortConfig.itens.direction='asc'; }

    paginacao.itens.paginaAtual = 1;
    atualizarTabelaItens();
}

window.aplicarFiltrosITEM = function() {
    const ano = document.getElementById('filtroAnoITEM')?.value;
    const orgao = (document.getElementById('filtroOrgaoITEM')?.value||'').toLowerCase().trim();
    const elemento = (document.getElementById('filtroElementoITEM')?.value||'').toLowerCase().trim();
    const descElem = (document.getElementById('filtroDescricaoElementoITEM')?.value||'').toLowerCase().trim();
    const fornecedor = (document.getElementById('filtroFornecedorITEM')?.value||'').toLowerCase().trim();
    const processo = (document.getElementById('filtroProcessoITEM')?.value||'').toLowerCase().trim();
    if (!dadosConsolidados.itens || dadosConsolidados.itens.length === 0) { window.itensFiltrados = []; atualizarTabelaItens(); return; }
    const licitacoesMap = {};
    if (dadosConsolidados.licitacoes) dadosConsolidados.licitacoes.forEach(l => { if (l && l['numero_processo_formatado']) licitacoesMap[l['numero_processo_formatado']] = l; });
    window.itensFiltrados = dadosConsolidados.itens.filter(item => {
        try {
            if (!item) return false;
            if (ano && String(item['ano_criacao_processo']||item.ano_referencia||'')!==String(ano)) return false;
            if (processo && !String(item['numero_processo_formatado']||'').toLowerCase().includes(processo)) return false;
            if (elemento && !String(item['codigo_elemento_item_despesa']||'').toLowerCase().includes(elemento)) return false;
            if (descElem && !String(item['nome_elemento_item_despesa']||'').toLowerCase().includes(descElem)) return false;
            const licRel = item['numero_processo_formatado'] ? licitacoesMap[item['numero_processo_formatado']] : null;
            if (orgao) { if (!licRel) return false; if (!String(licRel['nome_orgao_entidade_compra']||'').toLowerCase().includes(orgao)) return false; }
            if (fornecedor) { if (!licRel) return false; if (!String(licRel['nome_empresarial_nome_fornecedor']||'').toLowerCase().includes(fornecedor)) return false; }
            return true;
        } catch(e) { return false; }
    });
    window.itensFiltrados = ordenarDados(window.itensFiltrados, sortConfig.itens.column, sortConfig.itens.direction);
    paginacao.itens.paginaAtual = 1;
    paginacao.itens.totalPaginas = Math.ceil(window.itensFiltrados.length / paginacao.itens.itensPorPagina);
    atualizarTabelaItens();
};

window.limparFiltrosITEM = function() {
    ['filtroAnoITEM','filtroOrgaoITEM','filtroElementoITEM','filtroDescricaoElementoITEM','filtroFornecedorITEM','filtroProcessoITEM'].forEach(id => { const el=document.getElementById(id); if(el) el.value=id==='filtroAnoITEM'?'2026':''; });
    window.itensFiltrados = dadosConsolidados.itens?dadosConsolidados.itens.filter(i=>i&&(i['ano_criacao_processo']==2026||i.ano_referencia==2026)):[];
    window.itensFiltrados = ordenarDados(window.itensFiltrados, sortConfig.itens.column, sortConfig.itens.direction);
    paginacao.itens.paginaAtual = 1;
    paginacao.itens.totalPaginas = Math.ceil(window.itensFiltrados.length / paginacao.itens.itensPorPagina);
    atualizarTabelaItens();
};

function renderizarPaginacao(tipo) {
    let container, filtradas, pagAtual, totalPag, itensPorPag;
    if (tipo==='visaoGeral') { container=document.getElementById('paginacaoContainerVG'); filtradas=window.visaoGeralAgrupados||[]; pagAtual=paginacao.visaoGeral.paginaAtual; totalPag=paginacao.visaoGeral.totalPaginas; itensPorPag=paginacao.visaoGeral.itensPorPagina; }
    else if (tipo==='licitacoes') { container=document.getElementById('paginacaoContainerCL'); filtradas=window.licitacoesFiltradas||[]; pagAtual=paginacao.licitacoes.paginaAtual; totalPag=paginacao.licitacoes.totalPaginas; itensPorPag=paginacao.licitacoes.itensPorPagina; }
    else { container=document.getElementById('paginacaoContainerITEM'); filtradas=window.itensFiltrados||[]; pagAtual=paginacao.itens.paginaAtual; totalPag=paginacao.itens.totalPaginas; itensPorPag=paginacao.itens.itensPorPagina; }
    if (!container) return;
    if (filtradas.length===0) { container.innerHTML='<div class="pagination-info">Nenhum registro encontrado</div>'; return; }
    const inicio=(pagAtual-1)*itensPorPag+1, fim=Math.min(pagAtual*itensPorPag,filtradas.length);
    const sfx = tipo==='visaoGeral'?'VG':tipo==='licitacoes'?'CL':'ITEM';
    let html = `<div class="pagination-info"><span>Mostrando ${inicio.toLocaleString('pt-BR')}–${fim.toLocaleString('pt-BR')} de ${filtradas.length.toLocaleString('pt-BR')} registros</span><div class="page-size-selector"><span>Por pág:</span><select id="itensPorPagina${sfx}" onchange="alterarItensPorPagina('${tipo}')"><option value="25" ${itensPorPag==25?'selected':''}>25</option><option value="50" ${itensPorPag==50?'selected':''}>50</option><option value="100" ${itensPorPag==100?'selected':''}>100</option></select></div></div>`;
    html += `<div class="pagination-controls"><button onclick="mudarPagina('${tipo}',1)" ${pagAtual===1?'disabled':''} title="Primeira"><i class="fas fa-angle-double-left"></i></button><button onclick="mudarPagina('${tipo}',${pagAtual-1})" ${pagAtual===1?'disabled':''} title="Anterior"><i class="fas fa-angle-left"></i></button>`;
    let ini=Math.max(1,pagAtual-2), fim2=Math.min(totalPag,ini+4);
    if (ini>1) { html+=`<button onclick="mudarPagina('${tipo}',1)">1</button>`; if(ini>2) html+=`<span style="padding:0 4px">…</span>`; }
    for (let i=ini;i<=fim2;i++) html+=`<button onclick="mudarPagina('${tipo}',${i})" class="${i===pagAtual?'active':''}">${i}</button>`;
    if (fim2<totalPag) { if(fim2<totalPag-1) html+=`<span style="padding:0 4px">…</span>`; html+=`<button onclick="mudarPagina('${tipo}',${totalPag})">${totalPag}</button>`; }
    html+=`<button onclick="mudarPagina('${tipo}',${pagAtual+1})" ${pagAtual===totalPag?'disabled':''} title="Próxima"><i class="fas fa-angle-right"></i></button><button onclick="mudarPagina('${tipo}',${totalPag})" ${pagAtual===totalPag?'disabled':''} title="Última"><i class="fas fa-angle-double-right"></i></button></div>`;
    html+=`<div class="page-input"><input type="number" id="irPag${sfx}" min="1" max="${totalPag}" value="${pagAtual}" onkeypress="if(event.key==='Enter')irParaPagina('${tipo}')"><button onclick="irParaPagina('${tipo}')">Ir</button></div>`;
    container.innerHTML = html;
}

window.mudarPagina = function(tipo, pagina) {
    const tp = tipo==='visaoGeral'?paginacao.visaoGeral.totalPaginas:tipo==='licitacoes'?paginacao.licitacoes.totalPaginas:paginacao.itens.totalPaginas;
    if (pagina<1||pagina>tp) return;
    if (tipo==='visaoGeral') { paginacao.visaoGeral.paginaAtual=pagina; atualizarTabelaVisaoGeral(); }
    else if (tipo==='licitacoes') { paginacao.licitacoes.paginaAtual=pagina; atualizarTabelaConsultaLicitacao(); }
    else { paginacao.itens.paginaAtual=pagina; atualizarTabelaItens(); }
};

window.alterarItensPorPagina = function(tipo) {
    const sfx=tipo==='visaoGeral'?'VG':tipo==='licitacoes'?'CL':'ITEM';
    const val=parseInt(document.getElementById('itensPorPagina'+sfx).value);
    if (tipo==='visaoGeral') { paginacao.visaoGeral.itensPorPagina=val; paginacao.visaoGeral.paginaAtual=1; paginacao.visaoGeral.totalPaginas=Math.ceil((window.visaoGeralAgrupados||[]).length/val); atualizarTabelaVisaoGeral(); }
    else if (tipo==='licitacoes') { paginacao.licitacoes.itensPorPagina=val; paginacao.licitacoes.paginaAtual=1; paginacao.licitacoes.totalPaginas=Math.ceil((window.licitacoesFiltradas||[]).length/val); atualizarTabelaConsultaLicitacao(); }
    else { paginacao.itens.itensPorPagina=val; paginacao.itens.paginaAtual=1; paginacao.itens.totalPaginas=Math.ceil((window.itensFiltrados||[]).length/val); atualizarTabelaItens(); }
};

window.irParaPagina = function(tipo) {
    const sfx=tipo==='visaoGeral'?'VG':tipo==='licitacoes'?'CL':'ITEM';
    const input=document.getElementById('irPag'+sfx); if (!input) return;
    const tp=tipo==='visaoGeral'?paginacao.visaoGeral.totalPaginas:tipo==='licitacoes'?paginacao.licitacoes.totalPaginas:paginacao.itens.totalPaginas;
    let p=parseInt(input.value); if(isNaN(p)||p<1) p=1; if(p>tp) p=tp;
    mudarPagina(tipo, p);
};

window.copiarLink = copiarLinkDireto;

function gerarURLComFiltros() {
    try {
        const url = new URL(window.location.href);
        const params = new URLSearchParams();
        const activeTab = document.querySelector('.nav-tabs .nav-link.active');
        if (activeTab) params.set('tab', activeTab.id.replace('-tab',''));
        const filtrosVG = { ano: document.getElementById('filtroAnoVG')?.value, orgao: document.getElementById('filtroOrgaoVG')?.value, modalidade: document.getElementById('filtroModalidadeVG')?.value, situacao: document.getElementById('filtroSituacaoVG')?.value, emergencial: document.getElementById('filtroEmergencialVG')?.value, tipo: document.getElementById('filtroTipoVG')?.value };
        Object.entries(filtrosVG).forEach(([k,v]) => { if(v) params.set(`vg_${k}`,v); });
        const filtrosCL = { ano: document.getElementById('filtroAnoCL')?.value, orgao: document.getElementById('filtroOrgaoCL')?.value, modalidade: document.getElementById('filtroModalidadeCL')?.value, situacao: document.getElementById('filtroSituacaoCL')?.value, situacaoItem: document.getElementById('filtroSituacaoItemCL')?.value, emergencial: document.getElementById('filtroEmergencialCL')?.value, tipo: document.getElementById('filtroTipoCL')?.value, processo: document.getElementById('filtroProcessoCL')?.value, fornecedor: document.getElementById('filtroFornecedorCL')?.value, cnpj: document.getElementById('filtroCnpjCL')?.value, objeto: document.getElementById('filtroObjetoCL')?.value };
        Object.entries(filtrosCL).forEach(([k,v]) => { if(v) params.set(`cl_${k}`,v); });
        const filtrosITEM = { ano: document.getElementById('filtroAnoITEM')?.value, orgao: document.getElementById('filtroOrgaoITEM')?.value, elemento: document.getElementById('filtroElementoITEM')?.value, descricaoElemento: document.getElementById('filtroDescricaoElementoITEM')?.value, fornecedor: document.getElementById('filtroFornecedorITEM')?.value, processo: document.getElementById('filtroProcessoITEM')?.value };
        Object.entries(filtrosITEM).forEach(([k,v]) => { if(v) params.set(`item_${k}`,v); });
        url.search = params.toString();
        return url.toString();
    } catch(e) { return window.location.href; }
}

function carregarFiltrosDaURL() {
    const params = new URLSearchParams(window.location.search);
    const tab = params.get('tab');
    if (tab) { const el = document.getElementById(`${tab}-tab`); if (el) setTimeout(() => el.click(), 100); }
    const filtrosVG = ['ano','orgao','modalidade','situacao','emergencial','tipo'];
    filtrosVG.forEach(f => { const v=params.get(`vg_${f}`); if(v) { const el=document.getElementById(`filtro${f.charAt(0).toUpperCase()+f.slice(1)}VG`); if(el) el.value=v; } });
    const filtrosCL = ['ano','orgao','modalidade','situacao','situacaoItem','emergencial','tipo','processo','fornecedor','cnpj','objeto'];
    filtrosCL.forEach(f => { const v=params.get(`cl_${f}`); if(v) { const el=document.getElementById(`filtro${f.charAt(0).toUpperCase()+f.slice(1)}CL`); if(el) el.value=v; } });
    const filtrosITEM = ['ano','orgao','elemento','descricaoElemento','fornecedor','processo'];
    filtrosITEM.forEach(f => { const v=params.get(`item_${f}`); if(v) { const el=document.getElementById(`filtro${f.charAt(0).toUpperCase()+f.slice(1)}ITEM`); if(el) el.value=v; } });
}

window.exportarTabelaLicitacao = function() {
    const dados = (window.licitacoesFiltradas||[]).map(item => { const linha=[]; for (const col of ordemColunas) { if(col==='numero_processo_formatado') linha.push(item['numero_processo_formatado']); else if(col==='numero_contrato'&&colunasVisiveis.numero_contrato) linha.push(getInfoContrato(item).numero||getInfoContrato(item).texto); else if(col==='nome_orgao_entidade_compra'&&colunasVisiveis.nome_orgao_entidade_compra) linha.push(item['nome_orgao_entidade_compra']||''); else if(col==='procedimento_contratacao_detalhamento_1'&&colunasVisiveis.procedimento_contratacao_detalhamento_1) linha.push(item['procedimento_contratacao_detalhamento_1']||''); else if(col==='data_licitacao'&&colunasVisiveis.data_licitacao) linha.push(getDataSessao(item).replace(/<[^>]*>/g,'')); else if(col==='objeto_processo'&&colunasVisiveis.objeto_processo) linha.push(item['objeto_processo']||''); else if(col==='nome_empresarial_nome_fornecedor'&&colunasVisiveis.nome_empresarial_nome_fornecedor) linha.push(item['nome_empresarial_nome_fornecedor']||''); else if(col==='situacao_processo') linha.push(item['situacao_processo']||''); else if(col==='situacao_compra_item_processo'&&colunasVisiveis.situacao_compra_item_processo) linha.push(item['situacao_compra_item_processo']||''); else if(col==='valor_total_homologado') linha.push(item['valor_total_homologado']||''); } return linha; });
    const csv = [['Processo','Contrato','Órgão','Modalidade','Data Sessão','Objeto','Fornecedor','Sit. Processo','Sit. Item','Valor Total'].join(';'), ...dados.map(l=>l.map(c=>`"${c||''}"`).join(';'))].join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='consulta_licitacoes.csv'; a.click();
};

window.baixarCSV = function(tipo, anoFiltro) {
    let dados, cabecalhos, nomeArquivo;
    if (tipo==='licitacoes') { dados=anoFiltro?dadosConsolidados.licitacoes.filter(l=>l&&(l['ano_criacao_pedido']==anoFiltro||l.ano_referencia==anoFiltro)):dadosConsolidados.licitacoes; cabecalhos=['ano_criacao_pedido','procedimento_contratacao_grupo','procedimento_contratacao_detalhamento_1','procedimento_contratacao_especializacao','codigo_orgao_entidade_compra','nome_orgao_entidade_compra','numero_processo_formatado','data_criacao_pedido','data_licitacao','numero_contrato','indicador_termo_de_contrato','situacao_processo','situacao_compra_item_processo','criterio_julgamento','objeto_processo','nome_empresarial_nome_fornecedor','cnpj_cpf_fornecedor_formatado','numero_parecer_juridico','data_parecer_juridico','edital_retificacao_arquivos','contrato_termoaditivo_arquivos','valor_total_homologado','valor_total_atualizado']; nomeArquivo=anoFiltro?`licitacoes_${anoFiltro}.csv`:'licitacoes_completas.csv'; }
    else if (tipo==='itens') { dados=anoFiltro?dadosConsolidados.itens.filter(i=>i&&(i['ano_criacao_processo']==anoFiltro||i.ano_referencia==anoFiltro)):dadosConsolidados.itens; cabecalhos=['ano_criacao_processo','numero_processo_formatado','situacao_item_processo','numero_item_processo','codigo_elemento_item_despesa','nome_elemento_item_despesa','codigo_item_material_servico_numerico','item_material_servico','quantidade_item_pedido','valor_unitario_referencia_item_pedido','valor_total_referencia_item_pedido']; nomeArquivo=anoFiltro?`itens_${anoFiltro}.csv`:'itens_completos.csv'; }
    else return;
    if (!dados||dados.length===0) { alert('Nenhum dado encontrado.'); return; }
    const linhas = dados.map(item=>cabecalhos.map(cab=>{ let v=item&&item[cab]!==undefined&&item[cab]!==null?item[cab]:''; return `"${v.toString().replace(/"/g,'""')}"` }).join(';'));
    const csv = [cabecalhos.join(';'), ...linhas].join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nomeArquivo; a.click();
};

document.addEventListener('click', e => {

    if (!e.target.closest('.column-selector')) document.querySelectorAll('.column-selector-dropdown').forEach(d => d.classList.remove('show'));
});

document.addEventListener('DOMContentLoaded', () => {
    setupAtualizacaoData();
    carregarTodosDados();
    document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
        tab.addEventListener('shown.bs.tab', () => setTimeout(iframeUpdateHeight, 300));
    });
    window.addEventListener('resize', () => { clearTimeout(window.resizeTimer); window.resizeTimer = setTimeout(iframeUpdateHeight, 250); });
});

// 14. IFRAME RESIZE OBSERVER
// ============================================================
(function() {
    function sendHeight() {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) + 10;
        try { if(window.parent&&window.parent!==window) window.parent.postMessage({iframeHeight:h,iframeResize:true,type:'resize'},'*'); } catch(e) {}
    }
    if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
    else { window.addEventListener('resize', sendHeight); setInterval(sendHeight, 2000); }
    sendHeight();
})();
</script>
